version: '3'
services:
  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2

  app1:
    image: nginx:alpine
    volumes:
      - ./html/index.html:/usr/share/nginx/html/index.html:ro

  app2:
    image: nginx:alpine
    volumes:
      - ./html/index1.html:/usr/share/nginx/html/index.html:ro